name: ModForge Static Validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/modforge_build_jar.py"
      - "public/modforge/index.html"
      - "public/modforge-studio/index.html"
      - "public/modforge-lab/index.html"
      - ".github/workflows/modforge-build-jar.yml"
      - ".github/workflows/modforge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile scripts/modforge_build_jar.py

      - name: Extract ModForge scripts and ZIP self-test
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("public/modforge-lab/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline ModForge JavaScript was found.")
          Path("/tmp/modforge-page.js").write_text(inline[0], encoding="utf-8")

          start = html.index("function crc32Bytes")
          end = html.index("function versionParts", start)
          zip_helpers = html[start:end]
          test_js = zip_helpers + """
          import { writeFile } from 'node:fs/promises';
          const blob = makeZipBlob([
            { name: 'test-project/src/Main.java', content: 'class Main {}\\n' },
            { name: 'test-project/README.md', content: 'ZIP export self-test\\n' }
          ]);
          await writeFile('/tmp/modforge-test.zip', new Uint8Array(await blob.arrayBuffer()));
          """
          Path("/tmp/modforge-zip-test.mjs").write_text(test_js, encoding="utf-8")
          PY

      - name: Check browser JavaScript syntax
        run: node --check /tmp/modforge-page.js

      - name: Test generated ZIP archive
        run: |
          node /tmp/modforge-zip-test.mjs
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path = Path("/tmp/modforge-test.zip")
          with ZipFile(path) as archive:
              assert set(archive.namelist()) == {
                  "test-project/src/Main.java",
                  "test-project/README.md",
              }
              assert archive.read("test-project/src/Main.java").startswith(b"class Main {}")
              assert archive.testzip() is None
          print("Native ZIP writer created a valid downloadable archive.")
          PY

      - name: Ensure client-side GitHub token is not required
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/modforge-lab/index.html").read_text(encoding="utf-8")
          forbidden = [
              'id="ghToken"',
              'GITHUB FINE-GRAINED TOKEN',
              'function ghHeaders',
              'function ghJson(',
              'api.github.com/repos/',
              'GitHub-Build-Token'
          ]
          present = [item for item in forbidden if item in html]
          if present:
              raise SystemExit("Client-side GitHub authentication remains: " + ", ".join(present))
          if "async function downloadProjectZip" not in html:
              raise SystemExit("Tokenless project ZIP exporter is missing.")
          print("Tokenless ZIP export check passed.")
          PY
